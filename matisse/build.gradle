apply plugin: 'com.android.library'
apply plugin: 'checkstyle'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.zhihu.matisse'
    lint {
        abortOnError false
    }

    // Required for AGP 8+ to publish a release AAR
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    def activity_version = "1.10.1"
    // Java language implementation
    implementation "androidx.activity:activity:$activity_version"

    implementation "androidx.appcompat:appcompat:1.5.1"
    implementation "androidx.annotation:annotation:1.5.0"
    implementation 'com.google.android.material:material:1.3.0-alpha03'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'it.sephiroth.android.library.imagezoom:library:1.0.4'

    compileOnly 'com.github.bumptech.glide:glide:4.11.0'
    compileOnly 'com.squareup.picasso:picasso:2.71828'
}

task javadoc(type: Javadoc) {
    options.encoding = "utf-8"
}

checkstyle {
    toolVersion = '7.6.1'
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
}

task checkstyle(type:Checkstyle) {
    description 'Runs Checkstyle inspection against matisse sourcesets.'
    group = 'Code Quality'
    configFile rootProject.file('checkstyle.xml')
    ignoreFailures = false
    showViolations true
    classpath = files()
    source 'src/main/java'
}

// Explicit Maven publication so JitPack can upload the AAR
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.yccheok'      // ← Change to your GitHub user/org
                artifactId = 'Matisse'              // ← Change if you want a different artifact name
                version = '2.9'                     // ← Match your Git tag / release
            }
        }
    }
}
